    <meta charset="utf-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
  
<!-- html / head / css / end -->

</head>

<body>

<!-- html / navigation / noauth / begin -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">

  <div class="container-fluid">

    <a class="navbar-brand" href="/user/userHome">The Expensive App</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navbarColor01">

      <ul class="navbar-nav me-auto">


        <li class="nav-item">

          <a class="nav-link active" href="/">Home

            <span class="visually-hidden">(current)</span>

          </a>

        </li>
        
   <li class="nav-item">

          <a class="nav-link active" href="/auth/login">Login

            <span class="visually-hidden">(current)</span>

          </a>

        </li>
              
   <li class="nav-item">
        
          <a class="nav-link active" href="/auth/register">Register
        
            <span class="visually-hidden">(current)</span>
            
          </a>
          
        </li>

</ul>

</div>

</div>

</nav>

<!-- html / navigation / noauth / end -->

<main class ="container"></main>

<section class="row m-1"></section>

<section class="row m-1">

<h1>

Register

</h1>

</section>

<div class="container">

<form action="#" th:action="@{/auth/register}" th:object="${myUser}" method="post">


    <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" th:field="*{firstName}" class="form-control" id="firstName">
    </div>

    <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" th:field="*{lastName}" class="form-control" id="lastName">
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="text" th:field="*{email}" class="form-control" id="email">
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" th:field="*{password}" class="form-control" id="password">
    </div>

    <button type="submit" class="btn btn-primary">Create Account</button>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
<script th:src="@{/script.js}"> </script>
</body>
</html>
